[package]
name = "gluon-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High level IDL based on tokio, built on top of strong-ipc."

[features]
tracing = ["gluon-ipc-derive/tracing"]
# `RefExt::local_handler`: reaching the handler behind a proxy that leads to one of our
# own nodes, for a process that is both ends of an interface
local-handlers = ["strong-ipc/local-handlers"]

[dependencies]
strong-ipc.workspace = true
gluon-ipc-derive.workspace = true
bitflags = "2"
rustix = { version = "1.1.4", default-features = false, features = ["net", "fs"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", default-features = false, features = [
	"sync",
	"macros",
] }
